description: "EOJ Compile Sandbox"
mode: ONCE
uidmap {
  inside_id: "0"
  outside_id: "65534"
  count: 1
}
gidmap {
  inside_id: "0"
  outside_id: "65534"
  count: 1
}
rlimit_as: 2048
rlimit_cpu: 60
rlimit_nofile: 128
rlimit_nproc: 128
rlimit_fsize: 1048576
mount_proc: true
mount {
  src: "/usr"
  dst: "/usr"
  is_bind: true
  rw: false
}
mount {
  src: "/lib"
  dst: "/lib"
  is_bind: true
  rw: false
}
mount {
  src: "/lib64"
  dst: "/lib64"
  is_bind: true
  rw: false
}
mount {
  src: "/bin"
  dst: "/bin"
  is_bind: true
  rw: false
}
mount {
  src: "/sbin"
  dst: "/sbin"
  is_bind: true
  rw: false
}
mount {
  src: "/etc"
  dst: "/etc"
  is_bind: true
  rw: false
}
mount {
  src: "/dev/null"
  dst: "/dev/null"
  is_bind: true
  rw: true
}
mount {
  src: "/dev/zero"
  dst: "/dev/zero"
  is_bind: true
  rw: true
}
mount {
  src: "/dev/random"
  dst: "/dev/random"
  is_bind: true
  rw: true
}
mount {
  src: "/dev/urandom"
  dst: "/dev/urandom"
  is_bind: true
  rw: true
}
mount {
  src: "/dev/full"
  dst: "/dev/full"
  is_bind: true
  rw: true
}
seccomp_log: false
seccomp_string: "KILL { socket, connect, accept, accept4, bind, listen, sendto, recvfrom, sendmsg, recvmsg, sendmmsg, recvmmsg, setsockopt, getsockopt, shutdown, socketpair, mount, chroot, ptrace, setuid, setgid, setreuid, setregid, setresuid, setresgid, setgroups, capset, mknod, mknodat, init_module, finit_module, delete_module, reboot, kexec_load, swapon, swapoff, iopl, ioperm, sethostname, setdomainname, adjtimex, quotactl, process_vm_readv, process_vm_writev, open_by_handle_at, name_to_handle_at, perf_event_open } DEFAULT ALLOW"
time_limit: 60
max_cpus: 2
hostname: "compile-sandbox"
cwd: "/box"
keep_env: false
envar: "PATH=/usr/local/bin:/usr/bin:/bin"
envar: "HOME=/tmp"
envar: "LANG=C.UTF-8"
envar: "TMPDIR=/tmp"
