description: "EOJ Compile Sandbox"
mode: ONCE
uidmap {
  inside_id: "0"
  outside_id: "65534"
  count: 1
}
gidmap {
  inside_id: "0"
  outside_id: "65534"
  count: 1
}
rlimit_as: 2048
rlimit_cpu: 60
rlimit_nofile: 128
rlimit_nproc: 128
rlimit_fsize: 1048576
mount_proc: true
mount {
  src: "/usr"
  dst: "/usr"
  is_bind: true
  rw: false
}
mount {
  src: "/lib"
  dst: "/lib"
  is_bind: true
  rw: false
}
mount {
  src: "/lib64"
  dst: "/lib64"
  is_bind: true
  rw: false
}
mount {
  src: "/bin"
  dst: "/bin"
  is_bind: true
  rw: false
}
mount {
  src: "/sbin"
  dst: "/sbin"
  is_bind: true
  rw: false
}
mount {
  src: "/etc"
  dst: "/etc"
  is_bind: true
  rw: false
}
mount {
  src: "/dev/null"
  dst: "/dev/null"
  is_bind: true
  rw: true
}
mount {
  src: "/dev/zero"
  dst: "/dev/zero"
  is_bind: true
  rw: true
}
mount {
  src: "/dev/random"
  dst: "/dev/random"
  is_bind: true
  rw: true
}
mount {
  src: "/dev/urandom"
  dst: "/dev/urandom"
  is_bind: true
  rw: true
}
mount {
  src: "/dev/full"
  dst: "/dev/full"
  is_bind: true
  rw: true
}
mount {
  src: "/proc/self/fd"
  dst: "/dev/fd"
  is_bind: true
  rw: true
}
mount {
  src: "/proc/self/fd/0"
  dst: "/dev/stdin"
  is_bind: true
  rw: true
}
mount {
  src: "/proc/self/fd/1"
  dst: "/dev/stdout"
  is_bind: true
  rw: true
}
mount {
  src: "/proc/self/fd/2"
  dst: "/dev/stderr"
  is_bind: true
  rw: true
}
seccomp_log: false
seccomp_string: "ALLOW { access, faccessat, open, openat, close, read, write, pread64, pwrite64, lseek, dup, dup2, dup3, fcntl, flock, fsync, fdatasync, truncate, ftruncate, stat, lstat, fstat, newfstatat, fstatfs, statfs, getdents, getdents64, readlink, readlinkat, chdir, fchdir, getcwd, rename, renameat, renameat2, unlink, unlinkat, mkdir, mkdirat, rmdir, chmod, fchmod, fchmodat, chown, fchown, lchown, fchownat, utimensat, futimesat, utime, utimes, link, linkat, symlink, symlinkat, pipe, pipe2, tee, splice, brk, mmap, munmap, mprotect, mremap, madvise, mincore, mlock, munlock, mlockall, munlockall, exit, exit_group, getpid, getppid, gettid, getuid, getgid, geteuid, getegid, getpgid, getpgrp, getsid, getresuid, getresgid, getgroups, set_tid_address, set_robust_list, futex, clone, wait4, waitid, waitpid, kill, tkill, tgkill, rt_sigaction, rt_sigprocmask, rt_sigreturn, rt_sigpending, rt_sigtimedwait, rt_sigqueueinfo, sigaltstack, signalfd, signalfd4, eventfd, eventfd2, timerfd_create, timerfd_settime, timerfd_gettime, clock_gettime, clock_getres, clock_nanosleep, clock_settime, gettimeofday, nanosleep, time, timer_create, timer_settime, timer_gettime, timer_getoverrun, timer_delete, alarm, setitimer, getitimer, times, epoll_create, epoll_create1, epoll_ctl, epoll_wait, epoll_pwait, select, pselect6, poll, ppoll, uname, sysinfo, getrandom, getrlimit, setrlimit, getrusage, umask, sync, ioctl, readv, writev, preadv, pwritev, sched_yield, sched_getaffinity, sched_setaffinity, sched_getparam, sched_getscheduler, sched_setscheduler, sched_get_priority_min, sched_get_priority_max, sched_rr_get_interval, prctl, arch_prctl, capget, execve } DEFAULT TRAP(0)"
cgroup_mem_max: 2147483648
cgroup_mem_mount: "/sys/fs/cgroup"
cgroup_pids_max: 128
cgroup_cpu_ms_per_sec: 2000
time_limit: 60
max_cpus: 2
hostname: "compile-sandbox"
cwd: "/box"
keep_env: false
envar: "PATH=/usr/local/bin:/usr/bin:/bin"
envar: "HOME=/tmp"
envar: "LANG=C.UTF-8"
envar: "TMPDIR=/tmp"
