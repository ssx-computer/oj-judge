description: "EOJ Run Sandbox"
mode: ONCE
uidmap {
  inside_id: "0"
  outside_id: "65534"
  count: 1
}
gidmap {
  inside_id: "0"
  outside_id: "65534"
  count: 1
}
rlimit_as: 512
rlimit_cpu: 10
rlimit_nofile: 32
rlimit_nproc: 64
rlimit_fsize: 1048576
mount_proc: true
mount {
  src: "/usr"
  dst: "/usr"
  is_bind: true
  rw: false
}
mount {
  src: "/lib"
  dst: "/lib"
  is_bind: true
  rw: false
}
mount {
  src: "/lib64"
  dst: "/lib64"
  is_bind: true
  rw: false
}
mount {
  src: "/bin"
  dst: "/bin"
  is_bind: true
  rw: false
}
mount {
  src: "/sbin"
  dst: "/sbin"
  is_bind: true
  rw: false
}
mount {
  src: "/etc"
  dst: "/etc"
  is_bind: true
  rw: false
}
mount {
  src: "/dev/null"
  dst: "/dev/null"
  is_bind: true
  rw: true
}
mount {
  src: "/dev/zero"
  dst: "/dev/zero"
  is_bind: true
  rw: true
}
mount {
  src: "/dev/random"
  dst: "/dev/random"
  is_bind: true
  rw: true
}
mount {
  src: "/dev/urandom"
  dst: "/dev/urandom"
  is_bind: true
  rw: true
}
mount {
  src: "/dev/full"
  dst: "/dev/full"
  is_bind: true
  rw: true
}
mount {
  src: "/proc/self/fd"
  dst: "/dev/fd"
  is_bind: true
  rw: true
}
mount {
  src: "/proc/self/fd/0"
  dst: "/dev/stdin"
  is_bind: true
  rw: true
}
mount {
  src: "/proc/self/fd/1"
  dst: "/dev/stdout"
  is_bind: true
  rw: true
}
mount {
  src: "/proc/self/fd/2"
  dst: "/dev/stderr"
  is_bind: true
  rw: true
}
seccomp_log: false
seccomp_string: "DEFAULT TRAP\nALLOW access\nALLOW faccessat\nALLOW faccessat2\nALLOW open\nALLOW openat\nALLOW openat2\nALLOW close\nALLOW read\nALLOW write\nALLOW pread64\nALLOW pwrite64\nALLOW lseek\nALLOW dup\nALLOW dup2\nALLOW dup3\nALLOW fcntl\nALLOW flock\nALLOW fsync\nALLOW fdatasync\nALLOW truncate\nALLOW ftruncate\nALLOW stat\nALLOW lstat\nALLOW fstat\nALLOW newfstatat\nALLOW statx\nALLOW fstatfs\nALLOW statfs\nALLOW getdents\nALLOW getdents64\nALLOW readlink\nALLOW readlinkat\nALLOW chdir\nALLOW fchdir\nALLOW getcwd\nALLOW rename\nALLOW renameat\nALLOW renameat2\nALLOW unlink\nALLOW unlinkat\nALLOW mkdir\nALLOW mkdirat\nALLOW rmdir\nALLOW chmod\nALLOW fchmod\nALLOW fchmodat\nALLOW chown\nALLOW fchown\nALLOW lchown\nALLOW fchownat\nALLOW utimensat\nALLOW futimesat\nALLOW utime\nALLOW utimes\nALLOW link\nALLOW linkat\nALLOW symlink\nALLOW symlinkat\nALLOW pipe\nALLOW pipe2\nALLOW tee\nALLOW splice\nALLOW copy_file_range\nALLOW brk\nALLOW mmap\nALLOW mmap2\nALLOW munmap\nALLOW mprotect\nALLOW mremap\nALLOW madvise\nALLOW mincore\nALLOW mlock\nALLOW mlock2\nALLOW munlock\nALLOW mlockall\nALLOW munlockall\nALLOW exit\nALLOW exit_group\nALLOW getpid\nALLOW getppid\nALLOW gettid\nALLOW getuid\nALLOW getgid\nALLOW geteuid\nALLOW getegid\nALLOW getpgid\nALLOW getpgrp\nALLOW getsid\nALLOW getresuid\nALLOW getresgid\nALLOW getgroups\nALLOW set_tid_address\nALLOW set_robust_list\nALLOW futex\nALLOW futex_waitv\nALLOW clone\nALLOW clone3\nALLOW wait4\nALLOW waitid\nALLOW waitpid\nALLOW kill\nALLOW tkill\nALLOW tgkill\nALLOW rt_sigaction\nALLOW rt_sigprocmask\nALLOW rt_sigreturn\nALLOW rt_sigpending\nALLOW rt_sigtimedwait\nALLOW rt_sigqueueinfo\nALLOW sigaltstack\nALLOW signalfd\nALLOW signalfd4\nALLOW eventfd\nALLOW eventfd2\nALLOW timerfd_create\nALLOW timerfd_settime\nALLOW timerfd_gettime\nALLOW clock_gettime\nALLOW clock_getres\nALLOW clock_nanosleep\nALLOW clock_settime\nALLOW gettimeofday\nALLOW nanosleep\nALLOW time\nALLOW timer_create\nALLOW timer_settime\nALLOW timer_gettime\nALLOW timer_getoverrun\nALLOW timer_delete\nALLOW alarm\nALLOW setitimer\nALLOW getitimer\nALLOW times\nALLOW epoll_create\nALLOW epoll_create1\nALLOW epoll_ctl\nALLOW epoll_wait\nALLOW epoll_pwait\nALLOW epoll_pwait2\nALLOW select\nALLOW pselect6\nALLOW poll\nALLOW ppoll\nALLOW uname\nALLOW sysinfo\nALLOW getrandom\nALLOW getentropy\nALLOW getrlimit\nALLOW setrlimit\nALLOW getrusage\nALLOW umask\nALLOW sync\nALLOW syncfs\nALLOW ioctl\nALLOW readv\nALLOW writev\nALLOW preadv\nALLOW pwritev\nALLOW preadv2\nALLOW pwritev2\nALLOW rseq\nALLOW sched_yield\nALLOW sched_getaffinity\nALLOW sched_setaffinity\nALLOW sched_getparam\nALLOW sched_getscheduler\nALLOW sched_setscheduler\nALLOW sched_get_priority_min\nALLOW sched_get_priority_max\nALLOW sched_rr_get_interval\nALLOW ioprio_get\nALLOW ioprio_set\nALLOW personality\nALLOW perf_event_open\nALLOW socketpair\nALLOW prctl\nALLOW arch_prctl\nALLOW capget"
cgroup_mem_mount: "/sys/fs/cgroup"
hostname: "run-sandbox"
cwd: "/box"
keep_env: false
envar: "PATH=/usr/local/bin:/usr/bin:/bin"
envar: "HOME=/tmp"
envar: "LANG=C.UTF-8"
envar: "TMPDIR=/tmp"
