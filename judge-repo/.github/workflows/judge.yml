name: Judge Submission

on:
  push:
    paths:
      - 'submissions/*'

jobs:
  judge:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Extract submission info
        id: info
        run: |
          FILES=$(git diff --name-only HEAD^ HEAD 2>/dev/null | grep 'submissions/' | head -1)
          if [ -z "$FILES" ]; then
            FILES=$(find submissions/ -maxdepth 1 -type f ! -name '.gitkeep' | head -1)
          fi

          echo "file=$FILES" >> $GITHUB_OUTPUT
          FILENAME=$(basename "$FILES")
          SUBMISSION_ID=$(echo "$FILENAME" | sed 's/\.[^.]*$//')
          echo "submission_id=$SUBMISSION_ID" >> $GITHUB_OUTPUT
          EXT="${FILENAME##*.}"
          case "$EXT" in
            py) LANGUAGE="python" ;;
            cpp) LANGUAGE="cpp" ;;
            java) LANGUAGE="java" ;;
            js) LANGUAGE="javascript" ;;
            c) LANGUAGE="c" ;;
            go) LANGUAGE="go" ;;
            rs) LANGUAGE="rust" ;;
            *) LANGUAGE="unknown" ;;
          esac
          echo "language=$LANGUAGE" >> $GITHUB_OUTPUT
          echo "Detected submission: id=$SUBMISSION_ID, language=$LANGUAGE, file=$FILES"

      - name: Fetch judge data
        id: judge_data
        env:
          CALLBACK_SECRET: ${{ secrets.CALLBACK_SECRET }}
          WORKER_API: ${{ secrets.WORKER_API }}
        run: |
          SUBMISSION_ID="${{ steps.info.outputs.submission_id }}"
          if [ -z "$SUBMISSION_ID" ]; then
            echo "ERROR: No submission ID found"
            exit 1
          fi
          # Store judge data OUTSIDE the workspace: the sandbox container never
          # mounts $HOME, so untrusted code can never read the testcases file.
          mkdir -p "$HOME/judge_meta"
          RESPONSE=$(curl -s --max-time 10 --retry 3 -H "Authorization: Bearer $CALLBACK_SECRET" \
            "${WORKER_API}/api/v1/internal/judge-data?submission_id=${SUBMISSION_ID}")
          echo "$RESPONSE" > "$HOME/judge_meta/judge_data.json"
          echo "Fetched judge data for submission $SUBMISSION_ID"
          # GitHub Actions `env:` does NOT expand shell variables ($HOME stays
          # literal), so export the resolved path via GITHUB_ENV instead.
          echo "JUDGE_DATA_PATH=$HOME/judge_meta/judge_data.json" >> "$GITHUB_ENV"

      # The sandbox image is built ONCE and cached at repo level (Actions
      # cache). On cache hit we just `docker load` the saved image — no Docker
      # Hub pull, no rebuild. Keyed on the Dockerfile so a toolchain change
      # invalidates the cache automatically.
      - name: Restore sandbox image cache
        id: sandbox-cache-restore
        uses: actions/cache/restore@v4
        with:
          path: /tmp/sandbox-image
          key: sandbox-${{ runner.os }}-${{ hashFiles('docker/sandbox.Dockerfile') }}

      - name: Load or build sandbox image
        run: |
          set -euo pipefail
          if [ -f /tmp/sandbox-image/sandbox.tar ]; then
            echo "Sandbox image restored from cache, loading..."
            sudo docker load -i /tmp/sandbox-image/sandbox.tar
          else
            echo "Cache miss, building sandbox image (first run)..."
            sudo docker build -t sandbox:latest -f docker/sandbox.Dockerfile docker/
            mkdir -p /tmp/sandbox-image
            # `docker save -o` writes the file as root (docker daemon), and the
            # Actions cache save step (runner user) then cannot read it ->
            # "Permission denied". Stream to stdout instead so the file is
            # owned by the runner user; chmod as a defensive fallback.
            sudo docker save sandbox:latest > /tmp/sandbox-image/sandbox.tar
            chmod 666 /tmp/sandbox-image/sandbox.tar 2>/dev/null || true
          fi

      - name: Save sandbox image cache
        if: steps.sandbox-cache-restore.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: /tmp/sandbox-image
          key: sandbox-${{ runner.os }}-${{ hashFiles('docker/sandbox.Dockerfile') }}

      - name: Compile and Judge (sandboxed)
        id: judge
        run: |
          chmod +x scripts/judge.sh
          bash scripts/judge.sh
        env:
          SUBMISSION_ID: ${{ steps.info.outputs.submission_id }}
          LANGUAGE: ${{ steps.info.outputs.language }}
          SOURCE_FILE: ${{ steps.info.outputs.file }}
          JUDGE_DATA: ${{ env.JUDGE_DATA_PATH }}

      - name: Callback result
        if: always()
        env:
          CALLBACK_SECRET: ${{ secrets.CALLBACK_SECRET }}
          WORKER_API: ${{ secrets.WORKER_API }}
          SUBMISSION_ID: ${{ steps.info.outputs.submission_id }}
        run: |
          set -o errexit
          if [ -z "$SUBMISSION_ID" ]; then
            echo "ERROR submission_id empty, skip callback"
            exit 0
          fi
          CALL_URL="${WORKER_API}/api/v1/internal/callback"
          if [ -f result.json ]; then
            echo "Send normal callback, file content:"
            cat result.json
            RESP=$(curl -X POST "$CALL_URL" \
              --max-time 10 --retry 2 \
              -H "Authorization: Bearer $CALLBACK_SECRET" \
              -H "Content-Type: application/json" \
              -d @result.json -w $'\nHTTP_CODE=%{http_code}' 2>&1)
            echo "$RESP"
            if echo "$RESP" | grep -q "HTTP_CODE=200"; then
              echo "Callback success"
            else
              echo "Callback request failed, trigger fallback"
              echo "{\"submission_id\":\"$SUBMISSION_ID\",\"status\":\"system_error\",\"details\":[{\"message\":\"Judge callback request failed\"}]}" > fallback_result.json
              curl -X POST "$CALL_URL" \
                --max-time 10 --retry 2 \
                -H "Authorization: Bearer $CALLBACK_SECRET" \
                -H "Content-Type: application/json" \
                -d @fallback_result.json
            fi
          else
            echo "No result.json, send system error fallback"
            echo "{\"submission_id\": \"$SUBMISSION_ID\", \"status\": \"system_error\", \"details\": [{\"status\": \"system_error\", \"message\": \"Judge failed to produce result\"}]}" > fallback_result.json
            curl -X POST "$CALL_URL" \
              --max-time 10 --retry 2 \
              -H "Authorization: Bearer $CALLBACK_SECRET" \
              -H "Content-Type: application/json" \
              -d @fallback_result.json
          fi
